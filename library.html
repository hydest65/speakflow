<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频库 | SpeakVlog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="library" class="speakvlog-library">
  <header class="topbar">
    <a class="logo" href="index.html" aria-label="SpeakVlog 首页">
      <span class="logo-mark"><span></span></span>
      <span class="logo-type"><strong>SpeakVlog</strong><small>Real Video Speaking Lab</small></span>
    </a>
    <nav class="pill-nav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a class="active" href="library.html">视频库</a>
      <a href="favorites.html">收藏夹</a>
      <a href="tips.html">学习卡片</a>
      <a href="ai.html">AI 陪练</a>
      <a href="pricing.html">会员</a>
    </nav>
  </header>

  <main class="app-shell">
    <aside class="side-column">
      <section class="panel stats-panel compact-panel">
        <div class="panel-title"><span class="mini-icon"></span><h2>今日状态</h2></div>
        <div class="stat-row" id="today-stats">
          <div class="stat-item primary"><strong>0</strong><span>连续打卡</span></div>
          <div class="stat-item"><strong>0</strong><span>今日句子</span></div>
          <div class="stat-item"><strong>--</strong><span>平均评分</span></div>
        </div>
      </section>
      <section class="panel task-panel compact-panel">
        <p class="eyebrow">Daily Task</p>
        <h2>完成 1 个真实视频训练</h2>
        <ul class="task-list" id="today-task-list">
          <li><span></span>精听 3 个关键句</li>
          <li><span></span>完成 1 次跟读录音</li>
          <li><span></span>获得一次 AI 评分</li>
          <li><span></span>完成今日打卡</li>
        </ul>
        <a class="button primary" href="learn.html">开始训练</a>
      </section>
    </aside>

    <section class="content-column">
      <section class="panel today-pick" id="today-pick"></section>
      <section class="panel library-toolbar" aria-label="视频库搜索">
        <div>
          <p class="eyebrow">Video Library</p>
          <h1>选择今天要精听的真实片段</h1>
          <p id="library-summary">按场景、难度和时长筛选，找到适合今天训练的内容。</p>
        </div>
        <label class="library-search">
          <span>搜索视频</span>
          <input id="library-search" type="search" placeholder="输入场景、来源或关键词">
        </label>
      </section>
      <section class="panel filter-panel" aria-label="视频筛选">
        <label><span>主题</span><select data-filter="topic"><option value="all">全部</option><option value="language">语言学习</option><option value="daily">日常</option><option value="workplace">职场</option><option value="travel">旅行</option><option value="interview">采访</option></select></label>
        <label><span>难度</span><select data-filter="difficulty"><option value="all">全部</option><option value="beginner">初级</option><option value="intermediate">中级</option><option value="advanced">高级</option></select></label>
        <label><span>时长</span><select data-filter="duration"><option value="all">全部</option><option value="short">1-3 分钟</option><option value="medium">3-8 分钟</option><option value="long">8 分钟以上</option></select></label>
        <label><span>来源</span><select data-filter="sourceType"><option value="all">全部</option><option value="ted">TED</option><option value="vlog">Vlog</option><option value="interview">采访</option><option value="workplace">职场会议</option><option value="ai-dialogue">AI 对话</option></select></label>
      </section>
      <section class="video-grid" id="video-grid" aria-live="polite"></section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
