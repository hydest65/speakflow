<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tips | SpeakFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="tips">
  <header class="topbar">
    <a class="logo" href="index.html" aria-label="SpeakFlow 首页">
      <span class="logo-mark"><span></span></span>
      <span class="logo-type"><strong>SpeakFlow</strong><small>Real Video Speaking Lab</small></span>
    </a>
    <nav class="pill-nav" aria-label="主导航">
      <a href="index.html">视频库</a>
      <a href="favorites.html">收藏夹</a>
      <a class="active" href="tips.html">Tips</a>
      <a href="ai.html">AI陪练</a>
      <a href="pricing.html">会员</a>
    </nav>
  </header>

  <main class="tips-workbench">
    <aside class="tips-video-rail">
      <div class="rail-head">
        <h1>视频库</h1>
        <p>选择一个视频，查看可复用语言素材。</p>
      </div>
      <label class="rail-search">
        <span>搜索视频</span>
        <input id="tips-search" type="search" placeholder="搜索视频...">
      </label>
      <div class="tips-video-list" id="tips-video-list"></div>
    </aside>

    <section class="tips-expression-area">
      <section class="tips-expression-head">
        <div>
          <p class="eyebrow">Expression Lab</p>
          <h1 id="tips-video-title">真实视频表达库</h1>
          <p id="tips-video-summary">从一个视频里拆出单词、短语和地道表达，直接拿去听、说、复习。</p>
        </div>
        <a class="button primary" id="tips-learn-link" href="learn.html">进入跟读</a>
      </section>

      <div class="tips-tabs" role="tablist" aria-label="表达类型">
        <button class="active" type="button" data-expression-tab="words">单词</button>
        <button type="button" data-expression-tab="phrases">短语</button>
        <button type="button" data-expression-tab="native">地道表达</button>
      </div>

      <div class="tips-toolbar">
        <div class="filter-chips" id="expression-filters"></div>
        <button class="button secondary" type="button" id="toggle-chinese">隐藏中文</button>
      </div>

      <section class="expression-grid" id="expression-grid" aria-live="polite"></section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
